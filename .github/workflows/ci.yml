name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test stage
        uses: docker/build-push-action@v6
        with:
          context: ./client-app
          file: ./client-app/Containerfile
          target: test
          push: false
          tags: playlist-generator:test-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export test coverage from Docker stage
        uses: docker/build-push-action@v6
        with:
          context: ./client-app
          file: ./client-app/Containerfile
          target: coverage-export
          outputs: type=local,dest=/tmp/test-coverage
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: /tmp/test-coverage/coverage
          if-no-files-found: error

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./client-app
          file: ./client-app/Containerfile
          push: false
          tags: playlist-generator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
